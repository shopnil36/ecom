services:
  - type: web
    name: chattrn-commerce
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: chattrn-commerce-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CHATTRN_ACCESS_TOKEN
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: chattrn-commerce-db
    plan: free
    region: singapore
    databaseName: chattrn
    user: chattrn
